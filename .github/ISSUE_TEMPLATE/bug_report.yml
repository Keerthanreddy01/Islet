name: 🐛 Bug Report
description: File a bug report to help us improve Islet
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem.
  - type: input
    id: version
    attributes:
      label: Islet Version / Commit
      description: What version of Islet are you running? (e.g. v0.1.0 or commit hash)
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows Operating System Version
      description: What version of Windows are you using?
      options:
        - Windows 11 (64-bit)
        - Windows 10 (64-bit)
        - Windows Server
        - Other (specify below)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can the maintainers reproduce this issue?
      placeholder: |
        1. Launch Islet with `npm run dev`
        2. Play music in Spotify / YouTube
        3. Hover over the capsule
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: media_player
    attributes:
      label: Relevant Media Player or AI Agent (if applicable)
      description: e.g. Spotify Desktop, Chrome/YouTube, Google Antigravity, Claude Code.
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste any error messages from the terminal or `%APPDATA%\islet\islet.log` (sanitize any private info).
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have checked existing issues to verify this is not a duplicate.
          required: true
        - label: I have not included any sensitive personal data, tokens, or credentials in this report.
          required: true
